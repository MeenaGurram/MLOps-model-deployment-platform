apiVersion: apps/v1
kind: Deployment

metadata:
  name: mlops-api
  namespace: mlops-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mlops-api

  template:
    metadata:
      labels:
        app: mlops-api

    spec:
      containers:
      - name: mlops-api

        image: YOUR_DOCKERHUB_USERNAME/mlops-platform:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8000

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 8000

          initialDelaySeconds: 10
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 8000

          initialDelaySeconds: 30
          periodSeconds: 10